<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>Codex</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="app" id="app">

  <div class="donebar" id="doneBar" title="点击切到该 agent">
    <span class="dchk">
      <svg viewBox="0 0 12 12" width="8" height="8" fill="none" stroke="currentColor"
           stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M2 6.4 L4.6 9 L10 3.2"/>
      </svg>
    </span>
    <span class="dtxt"><b id="dAgent">CODEX</b><i id="dLabel"></i></span>
    <span class="grow"></span>
    <span class="dmore" id="dMore"></span>
    <span class="dtime" id="dTime">完成</span>
  </div>

  <div class="head" id="drag">
    <span class="dot" id="dot"></span>
    <span class="name" id="brand">CODEX</span>
    <span class="plan" id="plan">PLUS</span>
    <span class="grow"></span>
    <div class="seg" id="seg">
      <button data-mode="codex" class="on">CX</button>
      <button data-mode="antigravity">AG</button>
      <button data-mode="workbuddy">WB</button>
    </div>
    <button class="ico" id="refresh" title="刷新">
      <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round">
        <path d="M21 12a9 9 0 1 1-3.2-6.9"/><path d="M21 4v5h-5"/>
      </svg>
    </button>
  </div>

  <!-- Codex -->
  <div id="viewCodex">
    <div class="metric">
      <div class="mline">
        <span class="lab">5 小时</span>
        <span class="val" id="v5">--</span>
        <span class="sub" id="r5">--</span>
      </div>
      <div class="track"><i id="b5"></i></div>
    </div>

    <div class="metric">
      <div class="mline">
        <span class="lab">本周</span>
        <span class="val" id="vw">--</span>
        <span class="sub" id="rw">--</span>
      </div>
      <div class="track"><i id="bw"></i></div>
    </div>

    <div class="hair"></div>

    <div class="sess">
      <span class="sdot" id="sdot"></span>
      <span class="sstate" id="sstate">读取中</span>
      <span class="sctx" id="sctx">ctx --</span>
      <span class="grow"></span>
      <span class="sname" id="sname">—</span>
    </div>

    <div class="hair"></div>

    <button class="fold" id="foldCurve">
      <span class="flab">用量曲线</span>
      <span class="fsum" id="csum">--</span>
      <svg class="chev" id="chev2" viewBox="0 0 12 12" width="12" height="12" fill="none"
           stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 4.5 L6 7.5 L9 4.5"/>
      </svg>
    </button>

    <div class="foldbody" id="curveBody">
      <div class="charts">
        <div class="chart">
          <div class="chead"><span>5 小时</span><b id="c5top">--</b></div>
          <canvas id="c5" class="spark"></canvas>
        </div>
        <div class="chart">
          <div class="chead"><span>本周</span><b id="cwtop">--</b></div>
          <canvas id="cw" class="spark"></canvas>
        </div>
      </div>
    </div>

    <button class="fold" id="fold">
      <span class="flab">重置预测</span>
      <span class="fsum" id="fsum">--</span>
      <svg class="chev" id="chev" viewBox="0 0 12 12" width="12" height="12" fill="none"
           stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 4.5 L6 7.5 L9 4.5"/>
      </svg>
    </button>

    <div class="foldbody" id="foldbody">
      <div class="fgrid">
        <div class="fcell"><b id="p24">--</b><i>24 小时</i></div>
        <div class="fcell"><b id="p48">--</b><i>48 小时</i></div>
        <div class="fcell"><b id="age">--</b><i>距上次重置</i></div>
      </div>
      <div class="fmeta" id="fmeta">数据加载中…</div>
      <div class="fhint" id="fhint"></div>
    </div>
  </div>

  <!-- Antigravity -->
  <div id="viewAg" class="hidden">
    <div id="agList"></div>
    <div class="agfoot" id="agFoot">读取中…</div>
  </div>

  <!-- WorkBuddy -->
  <div id="viewWb" class="hidden">
    <div class="wbmline">
      <span class="wblab">当前模型</span>
      <span class="wbmname" id="wbModel">--</span>
      <span class="grow"></span>
      <span class="wbmmeta" id="wbModelSub"></span>
    </div>
    <div class="metric">
      <div class="mline">
        <span class="lab">今日</span>
        <span class="val wb" id="wbToday">--</span>
        <span class="sub" id="wbTodayReq">--</span>
      </div>
    </div>
    <div class="metric">
      <div class="mline">
        <span class="lab">近 7 天</span>
        <span class="val wb" id="wbWeek">--</span>
        <span class="sub" id="wbWeekReq">--</span>
      </div>
    </div>

    <div class="charts wbcharts">
      <div class="chart">
        <div class="chead"><span>今日每小时</span><b id="wbHTop">--</b></div>
        <canvas id="wbH" class="spark"></canvas>
      </div>
      <div class="chart">
        <div class="chead"><span>近 7 天</span><b id="wbDTop">--</b></div>
        <canvas id="wbD" class="spark"></canvas>
      </div>
    </div>

    <div class="agfoot">
      <span id="wbSess">--</span>
      <span id="wbLast">--</span>
    </div>
  </div>

</div>
<script src="bridge.js"></script>
<script src="app.js"></script>
</body>
</html>
